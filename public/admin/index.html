<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>资源站管理 · GalGames</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#252d3d;background:#f3f5fa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,600px);padding:40px;border-radius:24px;background:#fff;box-shadow:0 16px 64px #25386a0d;border:1px solid #e5e9f2}header small{color:#65718a;letter-spacing:.15em}h1{font-size:30px;line-height:1.3;margin:12px 0 18px}p{line-height:1.8;color:#62708a;margin:12px 0 24px}ul{padding-left:22px;color:#43506a;line-height:2;margin:0 0 28px}a{color:#365dbe;text-underline-offset:4px}.button{display:block;text-align:center;padding:14px 20px;border-radius:12px;background:#365dbe;color:#fff;font-weight:600;text-decoration:none}.note{font-size:14px;margin-top:20px;margin-bottom:0}.links{display:flex;gap:24px;margin-top:24px;font-size:14px}@media(prefers-color-scheme:dark){:root{color:#e6eaf4;background:#121725}.card{background:#1b2334;border-color:#2b364e}p,header small{color:#b0bbd2}ul{color:#d3dbec}a{color:#aabfff}.button{background:#5273cc;color:#fff}}@media(max-width:480px){.card{padding:28px 22px}h1{font-size:26px}}
  </style>
</head>
<body>
  <main class="card" data-pagefind-ignore>
    <header><small>GALGAME RESOURCES</small><h1>资源站管理</h1></header>
    <p>在网页里管理游戏，保存后自动更新网站。</p>
    <ul><li>新建、编辑游戏介绍，管理分类与标签</li><li>上传封面和截图，维护各版本下载地址</li><li>设为草稿、调整置顶，查看发布结果</li></ul>
    <a class="button" href="https://app.pagescms.org/kuaichu/Firefly/main/collection/games">使用 GitHub 登录管理后台</a>
    <p class="note">后台由开源 Pages CMS 提供。首次使用请登录 GitHub，并仅授权 kuaichu/Firefly 仓库。保存后通常需要几分钟完成发布。</p>
    <nav class="links" aria-label="站点链接"><a href="https://github.com/kuaichu/Firefly/actions/workflows/deploy.yml" target="_blank" rel="noopener noreferrer">查看发布进度</a><a href="/">返回资源站</a></nav>
  </main>
</body>
</html>
