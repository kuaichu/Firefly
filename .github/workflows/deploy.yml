name: Deploy GalGame to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galgame-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_GAME_API_BASE_URL: ${{ vars.PUBLIC_GAME_API_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source
        run: pnpm check && pnpm type-check
      - name: Build static pages and API catalog
        run: pnpm build:pages
      - name: Test API catalog and download targets
        run: python scripts/verify-game-api.py
      - name: Publish API catalog
        run: node scripts/sync-game-api.mjs
        env:
          GAME_API_PUBLISH_TOKEN: ${{ secrets.GAME_API_PUBLISH_TOKEN }}
      - name: Deploy Pages
        run: pnpm exec wrangler pages deploy dist --project-name galgame --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
